;
; ACME oneM2M IN-CSE Configuration for SDV Vehicular Edge
; Software-Defined Vehicle (SDV) Automotive IoT HVAC Monitoring
;

[basic.config]
cseType = IN
cseID = id-sdv
cseName = sdv-cse
adminID = CAdmin
dataDirectory = ${baseDirectory}
networkInterface = 0.0.0.0
cseHost = ${hostIPAddress}
httpPort = 8080
logLevel = info
databaseType = tinydb
consoleTheme = light

[cse.registration]
allowedCSROriginators = /id-mn
allowedAEOriginators = C*,S*,/id-sdv/C*,CAdmin

[database.tinydb]
writeDelay = 10

[http]
enable = true
enableManagementEndpoint = true

[webui]
enable = true
root = /webui

[mqtt]
enable = true
address = mosquitto
port = 1883
keepalive = 60
listenIF = 0.0.0.0
topicPrefix =
timeout = 10.0

[mqtt.security]
useTLS = False
verifyCertificate = False

[textui]
startWithTUI = False



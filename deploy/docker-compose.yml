version: "3.8"

networks:
  mec_mesh:
    driver: bridge
    name: sdv_mec_mesh

volumes:
  mosquitto_data:
  influxdb_data:
  grafana_data:
  nodered_data:

services:
  # ----------------------------------------------------------------------------
  # MQTT Broker Tier: Mutual TLS 1.3 Termination on Port 8883
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: sdv_mosquitto_broker
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - mec_mesh

  # ----------------------------------------------------------------------------
  # oneM2M Middleware Tier: IN-CSE Resource Tree
  # ----------------------------------------------------------------------------
  onem2m_cse:
    image: anank2/acme-cse:latest
    container_name: sdv_onem2m_cse
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CSE_ID=${ONEM2M_CSE_ID:-sdv-cse}
      - CSE_NAME=${ONEM2M_CSE_NAME:-sdv-cse}
      - CSE_TYPE=IN
      - HTTP_PORT=8080
    networks:
      - mec_mesh

  # ----------------------------------------------------------------------------
  # Ingress Interworking Tier: Node-RED Ingress IPE
  # ----------------------------------------------------------------------------
  nodered_ipe:
    image: nodered/node-red:latest
    container_name: sdv_nodered_ipe
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/flows.json:/data/flows.json:ro
      - ./mosquitto/certs:/data/certs:ro
      - nodered_data:/data
    depends_on:
      - mosquitto
      - onem2m_cse
    networks:
      - mec_mesh

  # ----------------------------------------------------------------------------
  # Data Health & Persistence Tier: Bridge AE Service
  # ----------------------------------------------------------------------------
  bridge_ae:
    build:
      context: ../services/bridge_ae
      dockerfile: Dockerfile
    container_name: sdv_bridge_ae
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - INFLUXDB_ORG=${DOCKER_INFLUXDB_INIT_ORG:-fhtw_aiot}
      - INFLUXDB_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-cabin_telemetry}
      - MAX_LATENCY_S=${BRIDGE_AE_EVAL_MAX_LATENCY_S:-2.5}
      - MAX_DELTA_T_C=${BRIDGE_AE_MAX_DELTA_T_C:-1.5}
    depends_on:
      - onem2m_cse
      - influxdb
    networks:
      - mec_mesh

  # ----------------------------------------------------------------------------
  # Time-Series Storage Tier: InfluxDB 2.x
  # ----------------------------------------------------------------------------
  influxdb:
    image: influxdb:2.7-alpine
    container_name: sdv_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:-fhtw_aiot}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:-cabin_telemetry}
      - DOCKER_INFLUXDB_INIT_RETENTION=${DOCKER_INFLUXDB_INIT_RETENTION:-30d}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - mec_mesh

  # ----------------------------------------------------------------------------
  # Observability & Operations Cockpit Tier: Grafana Enterprise
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: sdv_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - mec_mesh

  # ----------------------------------------------------------------------------
  # Public Web Interface Tier: Flask Web Portal
  # ----------------------------------------------------------------------------
  web_portal:
    build:
      context: ../services/web_portal
      dockerfile: Dockerfile
    container_name: sdv_web_portal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - SECRET_KEY=${WEB_PORTAL_SECRET_KEY:-sdv-dev-portal-secret-key}
      - ONEM2M_CSE_URL=http://onem2m_cse:8080/sdv-cse
      - INFLUXDB_URL=http://influxdb:8086
    depends_on:
      - onem2m_cse
      - influxdb
    networks:
      - mec_mesh


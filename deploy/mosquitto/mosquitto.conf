# ==============================================================================
# Eclipse Mosquitto MQTT Broker Configuration
# Automotive Edge Gateway - FHTW-AIOT Research Cluster
# ==============================================================================

per_listener_settings true

# ------------------------------------------------------------------------------
# Internal Container Mesh Listener (Port 1883)
# Dedicated channel for ACME oneM2M IN-CSE native MQTT binding on internal bridge
# ------------------------------------------------------------------------------
listener 1883
protocol mqtt
allow_anonymous true
acl_file /mosquitto/config/acl.conf

# ------------------------------------------------------------------------------
# Perimeter Vehicular Listener: Mutual TLS 1.3 Termination (Port 8883)
# Enforces hardware cryptographic verification for physical vehicle edge nodes
# ------------------------------------------------------------------------------
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
acl_file /mosquitto/config/acl.conf

# Persistence Settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ==============================================================================
# Mosquitto Access Control Policy (ACL) Definition
# Enforces vehicular namespace isolation and oneM2M topic authorization
# ==============================================================================

# ------------------------------------------------------------------------------
# Anonymous access for internal MEC container mesh on Port 1883 (ACME IN-CSE)
# ------------------------------------------------------------------------------
topic readwrite /oneM2M/#
topic readwrite sdv/#

# ------------------------------------------------------------------------------
# ESP32-S3 Physical Edge Node (Vehicle 01 - authenticated via client cert on 8883)
# Supports both legacy telemetry topics and direct oneM2M TS-0010 MQTT primitives
# ------------------------------------------------------------------------------
user vehicle_edge_node_01
topic read sdv/vehicle_01/control/cmd
topic write sdv/vehicle_01/telemetry
topic readwrite /oneM2M/req/C_CabinNode_Car01/#
topic readwrite /oneM2M/resp/C_CabinNode_Car01/#
topic readwrite /oneM2M/req/id-sdv/C_CabinNode_Car01/#
topic readwrite /oneM2M/resp/id-sdv/C_CabinNode_Car01/#
topic readwrite /oneM2M/reg_req/C_CabinNode_Car01/#
topic readwrite /oneM2M/reg_resp/C_CabinNode_Car01/#

# ------------------------------------------------------------------------------
# Node-RED Ingress Interworking Proxy Entity (MEC Gateway Service on 8883)
# ------------------------------------------------------------------------------
user nodered_ipe_gateway
topic readwrite sdv/+/telemetry
topic readwrite sdv/+/control/cmd
topic readwrite /oneM2M/#

# ------------------------------------------------------------------------------
# System topic isolation
# ------------------------------------------------------------------------------
pattern read $SYS/#

# ==============================================================================
# Mosquitto Access Control Policy (ACL) Definition
# Enforces vehicular namespace isolation based on X.509 Common Names
# ==============================================================================

# ESP32-S3 Physical Edge Node (Vehicle 01)
user vehicle_edge_node_01
topic read sdv/vehicle_01/control/cmd
topic write sdv/vehicle_01/telemetry

# Node-RED Ingress Interworking Proxy Entity (MEC Gateway Service)
user nodered_ipe_gateway
topic readwrite sdv/+/telemetry
topic readwrite sdv/+/control/cmd

# Default deny for any unlisted topics or users
pattern read $SYS/#

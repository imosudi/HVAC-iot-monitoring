- url: '{{ base_url }}/{{ cse_rn }}/{{ active_vehicle_ae_rn }}?rcn=4'
  name: 6.1 Audit Vehicle Tree against Manifest (rcn=4)
  meta:
    id: req_val_001
    parentId: fld_validation_001
    created: 1791360061000
    modified: 1791360061000
    isPrivate: false
    sortKey: 70
  method: GET
  headers:
  - name: Accept
    value: application/json
  - name: X-M2M-Origin
    value: '{{ originator }}'
  - name: X-M2M-RI
    value: req_{% now 'unix' %}
  - name: X-M2M-RVI
    value: '{{ rvi }}'
  scripts:
    afterResponse: "if (insomnia.response.status >= 200 && insomnia.response.status\
      \ < 300) {\n    const body = insomnia.response.json();\n    const ae = body['m2m:ae']\
      \ || {};\n    let manifest = insomnia.environment.get('sensor_manifest') ||\
      \ [];\n    if (typeof manifest === 'string') {\n        try { manifest = JSON.parse(manifest);\
      \ } catch(e) { manifest = []; }\n    }\n    \n    const childCnts = (ae['m2m:cnt']\
      \ || []).concat(body['m2m:cnt'] || []);\n    const childCntNames = childCnts.map(c\
      \ => c.rn);\n    \n    const manifestNames = manifest.map(m => m.name);\n  \
      \  const present = manifestNames.filter(name => childCntNames.includes(name));\n\
      \    const missing = manifestNames.filter(name => !childCntNames.includes(name));\n\
      \    \n    const auditReport = {\n        vehicle_ae: ae.rn,\n        aei: ae.aei\
      \ || 'N/A',\n        ri: ae.ri,\n        total_manifest_expected: manifestNames.length,\n\
      \        verified_containers: present,\n        missing_containers: missing,\n\
      \        status: missing.length === 0 ? \"PASSED - 100% RECONCILED\" : \"INCOMPLETE\
      \ - MISSING CONTAINERS\"\n    };\n    console.log('================ AUDIT &\
      \ VALIDATION REPORT ================');\n    console.log(JSON.stringify(auditReport,\
      \ null, 2));\n    console.log('===========================================================');\n\
      }\n"

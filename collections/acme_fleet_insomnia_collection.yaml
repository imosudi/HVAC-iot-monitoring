- url: '{{ base_url }}/{{ cse_rn }}/{{ active_vehicle_ae_rn }}/raw-telemetry'
  name: 4.1 Ingest Synchronised Telemetry Snapshot
  meta:
    id: req_tel_001
    parentId: fld_telemetry_001
    created: 1791360041000
    modified: 1791360041000
    isPrivate: false
    sortKey: -30
  method: POST
  body:
    mimeType: application/json
    text: |-
      {
        "m2m:cin": {
          "cnf": "application/json:0",
          "con": {{ generated_telemetry_con_json }}
        }
      }
  headers:
  - name: Content-Type
    value: application/json;ty=4
  - name: Accept
    value: application/json
  - name: X-M2M-Origin
    value: '{{ telemetry_originator }}'
  - name: X-M2M-RI
    value: req_{% now 'unix' %}
  - name: X-M2M-RVI
    value: '{{ rvi }}'
  scripts:
    preRequest: |
      const aeRn = insomnia.environment.get('active_vehicle_ae_rn');
      if (!aeRn) {
          throw new Error('Telemetry publication failed: active_vehicle_ae_rn is not set. Run 02_Vehicle_Onboarding first.');
      }

      // Resolve originator: prefer server-assigned AEI, fallback to admin originator
      const orig = insomnia.environment.get('active_vehicle_originator') || insomnia.environment.get('originator') || 'CAdmin';
      insomnia.baseEnvironment.set('telemetry_originator', orig);

      const simEnabled = insomnia.environment.get('simulation_enabled') === true || insomnia.environment.get('simulation_enabled') === 'true';

      let sample;
      if (simEnabled) {
          const tempC = 21.0 + Math.random() * 3.5;
          const humidityPct = 42.0 + Math.random() * 12.0;
          sample = {
              is_simulated: true,
              simulation_notice: "SYNTHETIC TEST PAYLOAD - NOT LIVE VEHICLE MEASUREMENT",
              vehicle_id: aeRn,
              timestamp_unix_s: Math.floor(Date.now() / 1000),
              cabin: {
                  temperature_c: Number(tempC.toFixed(2)),
                  temperature_scd30: Number(tempC.toFixed(2)),
                  temperature_dht22: Number((tempC - 0.3).toFixed(2)),
                  humidity_pct: Number(humidityPct.toFixed(1)),
                  humidity_scd30: Number(humidityPct.toFixed(1)),
                  humidity_dht22: Number((humidityPct - 1.3).toFixed(1)),
                  co2_ppm: Number((540 + Math.random() * 180).toFixed(1)),
                  co_ppm: 0.2,
                  air_quality_score: 42,
                  exterior_aqi: 28
              },
              actuator_state: {
                  pwm_duty_pct: 75,
                  tachometer_rpm: Math.floor(1820 + Math.random() * 40),
                  carrier_freq_hz: 25000,
                  heater_state: "STANDBY",
                  eco_vent_state: "ACTIVE",
                  dehumidifier_state: "STANDBY",
                  recirculation_flap: "FRESH_AIR"
              }
          };
          console.log('[SIMULATION] Generated synthetic multi-hazard telemetry frame for:', aeRn);
      } else {
          const live = insomnia.environment.get('live_telemetry_payload');
          if (!live) {
              throw new Error('Simulation is disabled (simulation_enabled=false). Please provide "live_telemetry_payload" or set "simulation_enabled": true.');
          }
          sample = typeof live === 'string' ? JSON.parse(live) : live;
      }

      // Avoid manual quote-escaping bugs by using JSON.stringify nesting
      insomnia.baseEnvironment.set('generated_telemetry_con_json', JSON.stringify(JSON.stringify(sample)));
    afterResponse: |
      if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
          const body = insomnia.response.json();
          if (body && body['m2m:cin']) {
              const cin = body['m2m:cin'];
              insomnia.baseEnvironment.set('latest_cin_ri', cin.ri);
              const labels = cin.lbl || [];
              console.log('Published contentInstance to raw-telemetry. RI:', cin.ri);
              if (labels.length > 0) {
                  console.log('[IN-CSE HEALTH LABELS]:', labels);
              }
          }
      }

      \    const cseRn = insomnia.environment.get('cse_rn');\n    const aeRn = insomnia.environment.get('active_vehicle_ae_rn');\n\
      \    const originator = insomnia.environment.get('originator');\n    const rvi\
      \ = insomnia.environment.get('rvi') || '3';\n    \n    let manifest = insomnia.environment.get('sensor_manifest');\n\
      \    if (typeof manifest === 'string') {\n        try { manifest = JSON.parse(manifest);\
      \ } catch (e) { manifest = []; }\n    }\n    if (!Array.isArray(manifest) ||\
      \ manifest.length === 0) {\n        throw new Error('sensor_manifest is missing\
      \ or empty in environment.');\n    }\n\n    const sendFn = (typeof insomnia.send\
      \ === 'function') ? insomnia.send : (typeof insomnia.sendRequest === 'function'\
      \ ? insomnia.sendRequest : null);\n    const registry = {\n        aeResourceName:\
      \ aeRn,\n        aeRi: insomnia.environment.get('active_vehicle_ri'),\n    \
      \    aei: insomnia.environment.get('active_vehicle_aei'),\n        containers:\
      \ {}\n    };\n\n    console.log(`Reconciling ${manifest.length} manifest containers\
      \ for AE: ${aeRn}`);\n\n    for (const def of manifest) {\n        const expectedPath\
      \ = `${cseRn}/${aeRn}/${def.name}`;\n        const alreadyExists = uril.some(u\
      \ => u.endsWith('/' + def.name) || u === expectedPath);\n\n        if (alreadyExists)\
      \ {\n            console.log(`[EXISTING] Container already verified: ${def.name}`);\n\
      \            registry.containers[def.name] = {\n                path: expectedPath,\n\
      \                status: 'verified'\n            };\n        } else if (sendFn)\
      \ {\n            console.log(`[CREATING] Provisioning manifest container: ${def.name}\
      \ with mia: 86400`);\n            try {\n                const isRaw = def.name\
      \ === 'raw-telemetry';\n                const isCmd = def.name === 'commands';\n\
      \                const mniVal = isRaw ? 1440 : (isCmd ? 100 : 1000);\n     \
      \           const mbsVal = isRaw ? 2097152 : (isCmd ? 262144 : 1048576);\n\n\
      \                const postRes = await sendFn({\n                    url: `${baseUrl}/${cseRn}/${aeRn}`,\n\
      \                    method: 'POST',\n                    headers: {\n     \
      \                   'Content-Type': 'application/json;ty=3',\n             \
      \           'Accept': 'application/json',\n                        'X-M2M-Origin':\
      \ originator,\n                        'X-M2M-RI': 'req_' + Date.now() + '_'\
      \ + Math.floor(Math.random() * 1000),\n                        'X-M2M-RVI':\
      \ rvi\n                    },\n                    body: JSON.stringify({\n\
      \                        \"m2m:cnt\": {\n                            \"rn\"\
      : def.name,\n                            \"mni\": mniVal,\n                \
      \            \"mbs\": mbsVal,\n                            \"mia\": 86400,\n\
      \                            \"lbl\": [\"sensor\", def.location, def.measurement,\
      \ aeRn]\n                        }\n                    })\n               \
      \ });\n                const resData = typeof postRes.body === 'string' ? JSON.parse(postRes.body)\
      \ : postRes.body;\n                const cnt = resData && resData['m2m:cnt']\
      \ ? resData['m2m:cnt'] : {};\n                registry.containers[def.name]\
      \ = {\n                    ri: cnt.ri || null,\n                    path: expectedPath,\n\
      \                    status: 'created'\n                };\n               \
      \ console.log(`[SUCCESS] Provisioned ${def.name} (RI: ${cnt.ri}, mia: 86400)`);\n\
      \            } catch (postErr) {\n                console.error(`Failed to create\
      \ container ${def.name}:`, postErr.message);\n            }\n        }\n   \
      \ }\n\n    // Persist registry & downstream variables\n    insomnia.baseEnvironment.set('vehicle_registry',\
      \ registry);\n    insomnia.baseEnvironment.set('target_raw_cnt_path', `${cseRn}/${aeRn}/raw-telemetry`);\n\
      \    insomnia.baseEnvironment.set('target_co_cnt_path', `${cseRn}/${aeRn}/co-cabin`);\n\

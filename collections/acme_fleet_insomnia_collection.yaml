      \ AE:', ae.rn, 'RI:', ae.ri, 'Assigned AEI:', assignedAei);\n            }\n\
      \        } catch (err) {\n            console.warn('Could not retrieve existing\
      \ AE details:', err.message);\n        }\n    }\n}\n"
- url: '{{ base_url }}/{{ cse_rn }}/{{ active_vehicle_ae_rn }}?fu=1&ty=3'
  name: 2.2 Reconcile Containers from Manifest (Automated Routine)

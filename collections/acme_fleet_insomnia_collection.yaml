      \    if (body && body['m2m:ae']) {\n        const ae = body['m2m:ae'];\n   \
      \     insomnia.baseEnvironment.set('active_vehicle_ae_rn', ae.rn);\n       \
      \ insomnia.baseEnvironment.set('active_vehicle_ri', ae.ri);\n        // Capture\

      \ ae.ri, 'Assigned AEI:', assignedAei);\n    }\n} else if (insomnia.response.status\
      \ === 409) {\n    console.log('Vehicle AE already exists. Retrieving existing\
      \ AE to capture server identifiers...');\n    const baseUrl = insomnia.environment.get('base_url');\n\
      \    const cseRn = insomnia.environment.get('cse_rn');\n    const aeRn = insomnia.environment.get('active_vehicle_ae_rn');\n\
      \    const originator = insomnia.environment.get('originator');\n    const rvi\
      \ = insomnia.environment.get('rvi') || '3';\n    \n    const sendFn = (typeof\
      \ insomnia.send === 'function') ? insomnia.send : (typeof insomnia.sendRequest\
      \ === 'function' ? insomnia.sendRequest : null);\n    if (sendFn) {\n      \
      \  try {\n            const res = await sendFn({\n                url: `${baseUrl}/${cseRn}/${aeRn}`,\n\
      \                method: 'GET',\n                headers: {\n              \
      \      'Accept': 'application/json',\n                    'X-M2M-Origin': originator,\n\
      \                    'X-M2M-RI': 'req_' + Date.now(),\n                    'X-M2M-RVI':\
      \ rvi\n                }\n            });\n            const existing = typeof\
      \ res.body === 'string' ? JSON.parse(res.body) : res.body;\n            if (existing\
      \ && existing['m2m:ae']) {\n                const ae = existing['m2m:ae'];\n\
      \                insomnia.baseEnvironment.set('active_vehicle_ri', ae.ri);\n\

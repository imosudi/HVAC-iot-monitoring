          }
          const cleanId = identity.trim();
          let hash = 2166136261;
          for (let i = 0; i < cleanId.length; i++) {
              hash ^= cleanId.charCodeAt(i);
              hash = Math.imul(hash, 16777619);
          }
          const hashHex = (hash >>> 0).toString(16).padStart(8, '0');
          const safePrefix = cleanId.replace(/[^a-zA-Z0-9]/g, '_').slice(0, 12).toLowerCase();
          aeRn = `ae_${safePrefix}_${hashHex}`;
      }

      insomnia.baseEnvironment.set('active_vehicle_ae_rn', aeRn);
      const identInput = insomnia.environment.get('vehicle_identity_input') || 'unspecified';
      insomnia.baseEnvironment.set('vehicle_identity_label', 'identity:' + identInput);
      console.log('Initiating registration/reconciliation for Vehicle AE:', aeRn);
    afterResponse: "if (insomnia.response.status === 201 || (insomnia.response.status\

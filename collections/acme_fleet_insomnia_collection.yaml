type: collection.insomnia.rest/5.0
name: SDV_Expandable_Fleet_ACME_CSE
meta:
  id: wrk_sdv_fleet_onem2m_001
  created: 1791360000000
  modified: 1791360000000
  description: "Fully automated, parameterised oneM2M Insomnia collection for expandable connected vehicle fleet monitoring on ACME CSE."
collection:
  # =========================================================================
  # FOLDER 1: FLEET GOVERNANCE
  # =========================================================================
  - name: 01_Fleet_Governance
    meta:
      id: fld_fleet_governance_001
      created: 1791360010000
      modified: 1791360010000
      sortKey: -1000
      description: "Fleet-wide access control and fan-out group management"

  - url: "{{ _.url.url.base_url }}{{ cse_base }}"
    name: 1.1 Create Fleet ACP (acp_fleet_manager)
    meta:
      id: req_gov_001
      parentId: fld_fleet_governance_001
      created: 1791360011000
      modified: 1791360011000
      isPrivate: false
      sortKey: -100
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "m2m:acp": {
            "rn": "{{ fleet_acp_rn }}",
            "pv": {
              "acr": [
                {
                  "acor": ["{{ _.url.originator }}"],
                  "acop": 63
                },
                {
                  "acor": ["C_vehicle_nodes"],
                  "acop": 35
                }
              ]
            },
            "pvs": {
              "acr": [
                {
                  "acor": ["{{ _.url.originator }}"],
                  "acop": 63
                }
              ]
            }
          }
        }
    headers:
      - name: Content-Type
        value: application/json;ty=1
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.create }}"
    scripts:
      preRequest: |
        const acpName = insomnia.environment.get('fleet_acp_rn') || 'acp_fleet_manager';
        insomnia.baseEnvironment.set('fleet_acp_rn', acpName);
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            const body = insomnia.response.json();
            if (body && body['m2m:acp']) {
                const acp = body['m2m:acp'];
                insomnia.baseEnvironment.set('fleet_acp_ri', acp.ri);
                console.log('Created Fleet ACP:', acp.rn, 'RI:', acp.ri);
            }
        }

  - url: "{{ _.url.url.base_url }}{{ cse_base }}"
    name: 1.2 Create Fleet Group (grp_fleet_telemetry)
    meta:
      id: req_gov_002
      parentId: fld_fleet_governance_001
      created: 1791360012000
      modified: 1791360012000
      isPrivate: false
      sortKey: -90
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "m2m:grp": {
            "rn": "{{ fleet_grp_rn }}",
            "mt": 3,
            "mnm": 1000,
            "mid": [
              "{{ initial_group_member }}"
            ],
            "lbl": ["fleet", "telemetry", "sdv-cluster"]
          }
        }
    headers:
      - name: Content-Type
        value: application/json;ty=9
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.create }}"
    scripts:
      preRequest: |
        const cseId = insomnia.environment.get('cse_id') || 'id-in';
        const vId = insomnia.environment.get('active_vehicle_id') || 'vehicle-001';
        const rawCnt = insomnia.environment.get('target_raw_cnt_rn') || 'raw-telemetry';
        const member = `${cseId}/${vId}/${rawCnt}`;
        insomnia.baseEnvironment.set('initial_group_member', member);
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            const body = insomnia.response.json();
            if (body && body['m2m:grp']) {
                const grp = body['m2m:grp'];
                insomnia.baseEnvironment.set('fleet_grp_ri', grp.ri);
                console.log('Created Fleet Group:', grp.rn, 'RI:', grp.ri);
            }
        }

  # =========================================================================
  # FOLDER 2: VEHICLE PROVISIONING (PARAMETRISED FOR ANY VEHICLE)
  # =========================================================================
  - name: 02_Vehicle_Provisioning
    meta:
      id: fld_v001_provisioning_001
      created: 1791360020000
      modified: 1791360020000
      sortKey: -900
      description: "Provision vehicle application entity and the 7 standard telemetry containers"

  - url: "{{ _.url.url.base_url }}{{ cse_base }}"
    name: 2.1 Register Vehicle (AE)
    meta:
      id: req_v001_001
      parentId: fld_v001_provisioning_001
      created: 1791360021000
      modified: 1791360021000
      isPrivate: false
      sortKey: -80
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "m2m:ae": {
            "rn": "{{ target_vehicle_name }}",
            "api": "{{ _.url.api }}",
            "rr": true,
            "srv": ["2a", "3"],
            "lbl": ["vehicle", "{{ target_vehicle_name }}", "sdv-fleet"]
          }
        }
    headers:
      - name: Content-Type
        value: application/json;ty=2
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.create }}"
    scripts:
      preRequest: |
        const vName = insomnia.environment.get('target_vehicle_name') || 'vehicle-001';
        insomnia.baseEnvironment.set('target_vehicle_name', vName);
        console.log('Preparing registration for AE:', vName);
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            const body = insomnia.response.json();
            if (body && body['m2m:ae']) {
                const ae = body['m2m:ae'];
                insomnia.baseEnvironment.set('active_vehicle_id', ae.rn);
                insomnia.baseEnvironment.set('active_vehicle_ri', ae.ri);
                const orig = ae.aei || ("C_" + ae.rn.replace(/^AE_/, ""));
                insomnia.baseEnvironment.set('active_vehicle_originator', orig);
                console.log('Successfully registered AE:', ae.rn, 'Originator:', orig);
            }
        }


  - url: "{{ _.url.url.base_url }}{{ cse_base }}/{{ active_vehicle_id }}"
    name: 2.8 Create raw-telemetry Combined Container
    meta:
      id: req_v001_008
      parentId: fld_v001_provisioning_001
      created: 1791360028000
      modified: 1791360028000
      isPrivate: false
      sortKey: -10

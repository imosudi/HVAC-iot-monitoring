            if (body && body['m2m:cnt']) {
                const cseId = insomnia.environment.get('cse_id') || 'id-in';
                const vId = insomnia.environment.get('active_vehicle_id');
                const memberPath = `${cseId}/${vId}/${body['m2m:cnt'].rn}`;
                let members = insomnia.environment.get('fleet_member_ids') || [];
                if (!members.includes(memberPath)) {
                    members.push(memberPath);
                    insomnia.baseEnvironment.set('fleet_member_ids', members);
                }
                console.log('Added new telemetry container to fleet registry:', memberPath);
            }
        }

  - url: "{{ _.url.url.base_url }}{{ cse_base }}/{{ fleet_grp_rn }}"
    name: 3.3 Dynamically Synchronise Fleet Group Members
    meta:
      id: req_v002_003
      parentId: fld_v002_expansion_001
      created: 1791360043000
      modified: 1791360043000
      isPrivate: false
      sortKey: 30
    method: PUT
    body:
      mimeType: application/json
      text: |-
        {
          "m2m:grp": {
            "mid": {{ dynamic_fleet_members_json }}
          }
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.update }}"
    scripts:
      preRequest: |
        const members = insomnia.environment.get('fleet_member_ids') || [
            "id-in/vehicle-001/raw-telemetry",
            "id-in/vehicle-002/raw-telemetry"
        ];
        insomnia.baseEnvironment.set('dynamic_fleet_members_json', JSON.stringify(members));
        console.log('Updating Fleet Group with members:', members);
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            console.log('Fleet group successfully synchronised with all vehicle nodes.');
        }

  # =========================================================================
  # FOLDER 4: TELEMETRY INGESTION (DYNAMIC PRE-REQUEST DATA GENERATION)
  # =========================================================================
  - name: 04_Telemetry_Ingestion
    meta:
      id: fld_telemetry_ingest_001
      created: 1791360050000
      modified: 1791360050000
      sortKey: -700
      description: "Dynamic telemetry simulation with procedural realistic sensor readings"

  - url: "{{ _.url.url.base_url }}{{ cse_base }}/{{ active_vehicle_id }}/{{ target_raw_cnt_rn }}"
    name: 4.1 Publish Procedural Synchronised Telemetry Snapshot
    meta:
      id: req_ingest_001
      parentId: fld_telemetry_ingest_001
      created: 1791360051000
      modified: 1791360051000
      isPrivate: false
      sortKey: 40
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "m2m:cin": {
            "cnf": "application/json",
            "con": "{{ generated_telemetry_con }}"
          }
        }
    headers:
      - name: Content-Type
        value: application/json;ty=4
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.create }}"
    scripts:
      preRequest: |
        const vId = insomnia.environment.get('active_vehicle_id') || 'vehicle-001';
        insomnia.baseEnvironment.set('target_raw_cnt_rn', 'raw-telemetry');

        // Procedural realistic environmental telemetry generation
        const sample = {
            vehicle_id: vId,
            ts: Math.floor(Date.now() / 1000),
            cabin: {
                temp_c: Number((21.0 + Math.random() * 3.5).toFixed(1)),
                hum_pct: Number((42.0 + Math.random() * 12.0).toFixed(1)),
                co2_ppm: Math.floor(540 + Math.random() * 180),
                co_ppm: Number((0.15 + Math.random() * 0.15).toFixed(2)),
                iaq_score: Math.floor(36 + Math.random() * 12)
            },
            exterior: {
                aqi: Math.floor(22 + Math.random() * 14),
                pm2_5: Number((6.0 + Math.random() * 4.0).toFixed(1))
            },
            gps: {
                lat: 48.2082,
                lon: 16.3738
            }
        };
        insomnia.baseEnvironment.set('generated_telemetry_con', JSON.stringify(sample).replace(/"/g, '\\"'));
        console.log('Generated dynamic telemetry frame for:', vId);
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            const body = insomnia.response.json();
            if (body && body['m2m:cin']) {
                insomnia.baseEnvironment.set('latest_cin_ri', body['m2m:cin'].ri);
                console.log('Published contentInstance:', body['m2m:cin'].ri);
            }
        }

  - url: "{{ _.url.url.base_url }}{{ cse_base }}/{{ active_vehicle_id }}/{{ target_co_cnt_rn }}"
    name: 4.2 Publish Dynamic Critical CO Alarm Reading
    meta:
      id: req_ingest_003
      parentId: fld_telemetry_ingest_001
      created: 1791360053000
      modified: 1791360053000
      isPrivate: false
      sortKey: 60
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "m2m:cin": {
            "cnf": "application/json",
            "con": "{{ generated_co_alarm_con }}"
          }

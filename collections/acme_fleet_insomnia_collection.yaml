      text: |-
        {
          "m2m:cnt": {
            "rn": "{{ target_raw_cnt_rn }}",
            "mni": 1440,
            "mbs": 2097152,
            "lbl": ["telemetry", "synchronised", "snapshot", "{{ active_vehicle_id }}"]
          }
        }
    headers:
      - name: Content-Type
        value: application/json;ty=3
      - name: Accept
        value: application/json
      - name: X-M2M-Origin

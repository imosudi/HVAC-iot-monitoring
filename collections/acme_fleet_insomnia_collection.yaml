    headers:
      - name: Content-Type
        value: application/json;ty=4
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.create }}"
    scripts:
      preRequest: |
        insomnia.baseEnvironment.set('target_co_cnt_rn', 'co-cabin');
        const alarmData = {
            val: Number((50.0 + Math.random() * 15.0).toFixed(1)),
            unit: "ppm",
            alarm: true,
            severity: "CRITICAL",
            ts: Math.floor(Date.now() / 1000)
        };
        insomnia.baseEnvironment.set('generated_co_alarm_con', JSON.stringify(alarmData).replace(/"/g, '\\"'));
        console.log('Generated critical CO threshold alert:', alarmData.val, 'ppm');
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            const body = insomnia.response.json();
            if (body && body['m2m:cin']) {
                console.log('Published CO alert instance RI:', body['m2m:cin'].ri, '(Triggered sub_co_alert notification)');
            }
        }


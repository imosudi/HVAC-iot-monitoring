- name: 00_Preflight_and_Configuration
  meta:
    id: fld_preflight_001
    created: 1791360005000
    modified: 1791360005000
    sortKey: -1100
    description: Preflight environment validation, CSEBase verification, and reachability
      checks
- url: '{{ base_url }}/{{ cse_rn }}'
  name: 0.1 Validate Environment & Verify CSEBase
  meta:
    id: req_preflight_001
    parentId: fld_preflight_001
    created: 1791360006000
    modified: 1791360006000
    isPrivate: false
    sortKey: -1050
  method: GET
  headers:
  - name: Accept
    value: application/json
  - name: X-M2M-Origin
    value: '{{ originator }}'
  - name: X-M2M-RI
    value: req_{% now 'unix' %}
  - name: X-M2M-RVI
    value: '{{ rvi }}'
  scripts:
    preRequest: |
      // 1. Validate required environment settings
      const baseUrl = insomnia.environment.get('base_url');
      const cseRn = insomnia.environment.get('cse_rn');
      const originator = insomnia.environment.get('originator');
      const rvi = insomnia.environment.get('rvi');

      if (!baseUrl || baseUrl.trim() === '') {
          throw new Error('Preflight validation failed: "base_url" is required in environment.');
      }
      if (!cseRn || cseRn.trim() === '') {
          throw new Error('Preflight validation failed: "cse_rn" is required in environment.');
      }
      if (!originator || originator.trim() === '') {
          throw new Error('Preflight validation failed: "originator" is required in environment.');
      }
      if (!rvi || rvi.trim() === '') {
          throw new Error('Preflight validation failed: "rvi" is required in environment.');
      }

      // Normalise base_url trailing slash
      const cleanBase = baseUrl.replace(/\/+$/, '');
      if (cleanBase !== baseUrl) {
          insomnia.baseEnvironment.set('base_url', cleanBase);
      }

      // 2. Validate vehicle identity & derive stable AE resource name
      const explicitAe = insomnia.environment.get('vehicle_ae_rn');
      let activeAeRn = (explicitAe && explicitAe.trim() !== '') ? explicitAe.trim() : null;

      if (!activeAeRn) {
          const identity = insomnia.environment.get('vehicle_identity_input');
          if (!identity || identity.trim() === '') {
              throw new Error('Preflight validation failed: "vehicle_identity_input" is required to onboard a vehicle. Please configure an immutable vehicle identity (e.g. VIN or UUID).');
          }
          const cleanId = identity.trim();
          // Deterministic 32-bit FNV-1a hash
          let hash = 2166136261;
          for (let i = 0; i < cleanId.length; i++) {
              hash ^= cleanId.charCodeAt(i);
              hash = Math.imul(hash, 16777619);
          }
          const hashHex = (hash >>> 0).toString(16).padStart(8, '0');
          const safePrefix = cleanId.replace(/[^a-zA-Z0-9]/g, '_').slice(0, 12).toLowerCase();
          activeAeRn = `ae_${safePrefix}_${hashHex}`;
      }

      insomnia.baseEnvironment.set('active_vehicle_ae_rn', activeAeRn);
      const identInput = insomnia.environment.get('vehicle_identity_input') || 'unspecified';
      insomnia.baseEnvironment.set('vehicle_identity_label', 'identity:' + identInput);

      console.log('--- PREFLIGHT VALIDATION PASSED ---');
      console.log('Target CSEBase:', `${cleanBase}/${cseRn}`);
      console.log('Resolved AE Resource Name:', activeAeRn);
      console.log('Administrative Originator:', originator);
      console.log('Configured RVI:', rvi);
    afterResponse: |
      if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
          const body = insomnia.response.json();
          const cb = body['m2m:cb'];
          if (!cb) {
              throw new Error('CSEBase verification failed: response does not contain "m2m:cb" representation.');
          }

          // Verify configured CSEBase resource name against live CSEBase
          const configuredCseRn = insomnia.environment.get('cse_rn');
          if (cb.rn && cb.rn !== configuredCseRn) {
              console.warn(`[WARN] Configured cse_rn ("${configuredCseRn}") differs from live CSEBase rn ("${cb.rn}"). Updating environment to match server.`);
              insomnia.baseEnvironment.set('cse_rn', cb.rn);
          }

          // Capture CSE-ID and resource ID
          const cseId = cb.csi || cb.ri;
          insomnia.baseEnvironment.set('cse_id', cseId);

          // Validate RVI against supported releases
          const configuredRvi = insomnia.environment.get('rvi') || '3';
          const supportedReleases = cb.srv || [];
          if (supportedReleases.length > 0 && !supportedReleases.includes(configuredRvi)) {
              console.warn(`[WARN] Configured RVI (${configuredRvi}) may not be supported by CSE. Server supports: ${supportedReleases.join(', ')}`);
          }

          console.log('=== CSEBase Verified Successfully ===');
          console.log('CSE Resource Name (rn):', cb.rn);
          console.log('CSE Identifier (csi/ri):', cseId);
          console.log('Supported Releases (srv):', supportedReleases);
          console.log('Points of Access (poa):', cb.poa);
      } else {
          console.error('CSEBase reachability check failed with status:', insomnia.response.status);
      }
- url: '{{ base_url }}/{{ cse_rn }}'
  name: 0.2 Verify Notification Callback Configuration
  meta:
    id: req_preflight_002
    parentId: fld_preflight_001
    created: 1791360007000
    modified: 1791360007000
    isPrivate: false
    sortKey: -1040
  method: GET
  headers:
  - name: Accept
    value: application/json
  - name: X-M2M-Origin
    value: '{{ originator }}'
  - name: X-M2M-RI
    value: req_{% now 'unix' %}
  - name: X-M2M-RVI
    value: '{{ rvi }}'
  scripts:
    preRequest: |
      const notifUrl = insomnia.environment.get('notification_base_url');
      if (!notifUrl || notifUrl.trim() === '') {
          throw new Error('Preflight check failed: "notification_base_url" is required for subscription delivery. Please set a reachable URL in the environment.');
      }
      if (notifUrl.includes('localhost') || notifUrl.includes('127.0.0.1')) {
          console.warn('[WARN] "notification_base_url" is set to localhost/127.0.0.1. Ensure this is routable from the ACME CSE host, not only your workstation.');
      }
      console.log('Notification Callback Base URL configured as:', notifUrl);
    afterResponse: 'console.log(''Preflight reachability & callback configuration
      confirmed.'');

      '

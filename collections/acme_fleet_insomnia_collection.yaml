      \    const cseRn = insomnia.environment.get('cse_rn');\n    const grpName =\
      \ insomnia.environment.get('fleet_grp_rn');\n    const originator = insomnia.environment.get('originator');\n\
      \    const rvi = insomnia.environment.get('rvi') || '3';\n    \n    const sendFn\
      \ = (typeof insomnia.send === 'function') ? insomnia.send : (typeof insomnia.sendRequest\
      \ === 'function' ? insomnia.sendRequest : null);\n    if (sendFn) {\n      \
      \  try {\n            const res = await sendFn({\n                url: `${baseUrl}/${cseRn}/${grpName}`,\n\
      \                method: 'GET',\n                headers: {\n              \
      \      'Accept': 'application/json',\n                    'X-M2M-Origin': originator,\n\
      \                    'X-M2M-RI': 'req_' + Date.now(),\n                    'X-M2M-RVI':\
      \ rvi\n                }\n            });\n            const existing = typeof\
      \ res.body === 'string' ? JSON.parse(res.body) : res.body;\n            if (existing\
      \ && existing['m2m:grp']) {\n                insomnia.baseEnvironment.set('fleet_grp_ri',\
      \ existing['m2m:grp'].ri);\n                console.log('Idempotently reconciled\
      \ existing Group RI:', existing['m2m:grp'].ri);\n            }\n        } catch\
      \ (err) {\n            console.warn('Could not retrieve existing Group details:',\
      \ err.message);\n        }\n    }\n}\n"

    preRequest: |
      const grpName = insomnia.environment.get('fleet_grp_rn') || 'grp_fleet_telemetry';
      insomnia.baseEnvironment.set('fleet_grp_rn', grpName);

      // Only seed from verified members, zero concrete vehicle fallbacks
      let members = insomnia.environment.get('fleet_member_ids');
      if (!Array.isArray(members)) {
          members = [];

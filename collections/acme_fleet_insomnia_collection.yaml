        value: application/json;ty=2
      - name: Accept
        value: application/json
      - name: X-M2M-Origin
        value: "{{ _.url.originator }}"
      - name: X-M2M-RI
        value: req_{% now 'unix' %}
      - name: X-M2M-RVI
        value: "{{ _.url.rvi_pool.create }}"
    scripts:
      afterResponse: |
        if (insomnia.response.status >= 200 && insomnia.response.status < 300) {
            const body = insomnia.response.json();
            if (body && body['m2m:ae']) {
                const ae = body['m2m:ae'];
                insomnia.baseEnvironment.set('vehicle_001_name', ae.rn);
                insomnia.baseEnvironment.set('vehicle_001_ri', ae.ri);
                console.log('Registered vehicle-001:', ae.rn);
            }
        }


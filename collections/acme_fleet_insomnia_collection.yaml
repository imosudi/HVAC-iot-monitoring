          "m2m:ae": {
            "rn": "vehicle-001",
            "api": "{{ _.url.api }}",
            "rr": true,
            "srv": ["2a", "3"],
            "lbl": ["vehicle", "car-001", "sdv-fleet"]
          }
        }
    headers:
